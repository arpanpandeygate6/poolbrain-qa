[pytest]
testpaths = tests
addopts = -ra --strict-markers --alluredir=reports/allure-results
markers =
    smoke: read-only API checks safe to run on every environment (release gate)
    regression: full business-rule regression; UAT only
    db: includes SQL checks against a read replica
    flow(id): the business flow this test covers; id must be in flows/inventory.yaml
