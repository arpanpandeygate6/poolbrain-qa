# Slack app for the QA bot (Story 5.2; Story 2.4 reuses it).
# Create it at https://api.slack.com/apps → Create New App → From a manifest.
#
# Bot scopes are exactly the list below and nothing else (SEC-03). There are no
# event subscriptions, slash commands or interactivity: n8n polls Slack, so
# Slack never needs to reach n8n (SEC-02, outbound only).
# Invite the bot only to the QA Slack channel.
display_information:
  name: QA Bot
  description: PoolBrain QA automation. Posts test results and alerts from n8n.
  background_color: "#1d6fa5"
features:
  bot_user:
    display_name: QA Bot
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - reactions:read
      - channels:history
      - groups:history
      - usergroups:read
      - users:read
      - users:read.email
      - files:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
