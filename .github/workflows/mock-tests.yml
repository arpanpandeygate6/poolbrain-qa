# Runs the API and UI suites against the pretend PoolBrain (mock-poolbrain/)
# on every PR while there is no UAT access. Uses no secrets: test accounts are
# made up fresh for each run. Replaced by `uat-pr` once the suites point at
# real UAT.
name: mock-tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mock-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mock-tests:
    name: mock-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POOLBRAIN_ENV: uat
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            api-tests/requirements.txt
            mock-poolbrain/requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json

      - name: Install packages and browser
        run: |
          pip install -r api-tests/requirements.txt
          cd ui-tests && npm ci && npx playwright install --with-deps chromium

      - name: Start the pretend PoolBrain
        uses: ./.github/actions/start-mock-poolbrain

      - name: API tests
        id: api
        continue-on-error: true
        working-directory: api-tests
        run: python -m pytest

      - name: UI tests
        id: ui
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: ui-tests
        run: npx playwright test

      - name: Test report
        id: report
        if: always()
        uses: ./.github/actions/test-report
        with:
          name: mock-tests

      - name: Job summary
        id: summary
        if: always()
        run: |
          outcome=failure
          if [ "${{ steps.api.outcome }}" = success ] && [ "${{ steps.ui.outcome }}" = success ]; then outcome=success; fi
          python scripts/run_summary.py --title mock-tests --outcome "$outcome" \
            --detail "Commit=\`${{ github.event.pull_request.head.sha || github.sha }}\`" \
            --detail "Time=$(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST')" \
            --report-url "${{ steps.report.outputs.report-url }}" \
            --suite API=api-tests/reports/allure-results \
            --suite UI=ui-tests/reports/allure-results

      - name: Fail the check when tests failed
        if: always() && steps.summary.outputs.verdict != 'passed'
        run: exit 1
