# Secret-free PR checks (Story 1.3, AD-3). Required check on main: `ci`.
#
# This workflow must never use an Environment or a secret: it runs PR code,
# including PRs from forks and bots. UAT runs for PRs go through `uat-pr`.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: api-tests/requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json

      - name: Install Python packages
        run: pip install -r api-tests/requirements.txt

      - name: Install Node packages
        working-directory: ui-tests
        run: npm ci

      - name: Python lint
        run: ruff check .

      - name: Flow-tag check
        run: python scripts/flow_lint.py

      - name: Flow-tag linter tests
        working-directory: scripts
        run: python -m pytest

      - name: Collect API tests (no test runs)
        working-directory: api-tests
        # Exit code 5 means "no tests collected", which is fine while the suite is empty.
        run: python -m pytest --collect-only -q -p no:cacheprovider || test $? -eq 5

      - name: TypeScript type check
        working-directory: ui-tests
        run: npm run typecheck
