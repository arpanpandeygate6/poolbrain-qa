# "Run UAT tests" button (Story 1.5, AD-3).
#
# A QA member reviews a PR, then starts this workflow from main with the PR's
# head commit SHA. The first job checks the request without running any PR
# code; only then does the second job check out exactly that commit and run
# both suites. The result is set as the `uat-pr` commit status on the SHA.
#
# GitHub Free: the test job has no `environment: uat-pr` yet, because private
# repositories on Free have no Environments, and the suites run against the
# pretend PoolBrain, which needs no credentials. When UAT access and a plan
# with Environments arrive, add `environment: uat-pr` to the tests job and
# replace the "Start the pretend PoolBrain" step (see docs/runbook.md).
name: uat-pr
run-name: uat-pr for ${{ inputs.commit_sha }} by @${{ github.triggering_actor }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Paste the PR's head commit SHA you reviewed.
        required: true
        type: string

permissions: {}

concurrency:
  group: uat-pr-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check the request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      pr_number: ${{ steps.verify.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Check who started it and which commit
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: python scripts/uat_pr_verify.py

  tests:
    name: Run UAT tests
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    env:
      POOLBRAIN_ENV: uat
      COMMIT_SHA: ${{ inputs.commit_sha }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      # Tools (report step, summary script, pretend site) come from main, so
      # they work for PRs branched before they existed and PR code can't change them.
      - name: Check out the tools from main
        uses: actions/checkout@v5
        with:
          path: _qa-tools
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            mock-poolbrain

      - name: Mark the commit as pending
        run: |
          gh api "repos/${{ github.repository }}/statuses/$COMMIT_SHA" \
            -f state=pending -f context=uat-pr -f description="UAT tests running" -f target_url="$RUN_URL"

      - uses: actions/setup-python@v6
        with:
          python-version-file: _qa-tools/.python-version
          cache: pip
          cache-dependency-path: api-tests/requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version-file: _qa-tools/.nvmrc
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json

      - name: Install packages and browser
        run: |
          pip install -r api-tests/requirements.txt
          cd ui-tests && npm ci && npx playwright install --with-deps chromium

      - name: Start the pretend PoolBrain
        uses: ./_qa-tools/.github/actions/start-mock-poolbrain
        with:
          tools-path: _qa-tools

      - name: API tests
        id: api
        continue-on-error: true
        working-directory: api-tests
        run: python -m pytest

      - name: UI tests
        id: ui
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: ui-tests
        run: npx playwright test

      - name: Test report
        id: report
        if: always()
        uses: ./_qa-tools/.github/actions/test-report
        with:
          name: uat-pr

      - name: Job summary
        id: summary
        if: always()
        run: |
          outcome=failure
          if [ "${{ steps.api.outcome }}" = success ] && [ "${{ steps.ui.outcome }}" = success ]; then outcome=success; fi
          python _qa-tools/scripts/run_summary.py --title uat-pr --outcome "$outcome" \
            --detail "Commit=\`$COMMIT_SHA\`" \
            --detail "PR=#${{ needs.verify.outputs.pr_number }}" \
            --detail "Started by=@${{ github.triggering_actor }}" \
            --detail "Time=$(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST')" \
            --report-url "${{ steps.report.outputs.report-url }}" \
            --suite API=api-tests/reports/allure-results \
            --suite UI=ui-tests/reports/allure-results

      - name: Set the final uat-pr status
        if: always()
        run: |
          if [ "${{ steps.summary.outputs.verdict }}" = passed ]; then
            state=success; description="UAT tests passed"
          else
            state=failure; description="UAT tests failed or did not finish"
          fi
          gh api "repos/${{ github.repository }}/statuses/$COMMIT_SHA" \
            -f state="$state" -f context=uat-pr -f description="$description" -f target_url="$RUN_URL"
          [ "$state" = success ]
